name: Pull Request

on:
  pull_request:
    branches: ["main"]

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint application
        run: yarn lint

      - name: Typecheck application
        run: yarn typescript

      - name: Build application
        run: yarn build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_NODE_ENV: ${{ secrets.NEXT_PUBLIC_NODE_ENV }}

  unit:
    name: Unit tests
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: yarn test:unit

  integration:
    name: Integration tests
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: yarn test:integration

  e2e:
    name: E2E tests
    needs: checks
    runs-on: ubuntu-latest

    env:
      # The suite runs against tests/e2e/stub-api.mjs, and `next build` inlines
      # NEXT_PUBLIC_* into the client bundle — so it must be the stub URL here
      # too, not the real API.
      NEXT_PUBLIC_API_URL: http://localhost:4010

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build application
        run: yarn build

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  done:
    name: All checks passed
    needs: [unit, integration, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify every job succeeded
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          [ "${{ needs.unit.result }}" = "success" ] \
            && [ "${{ needs.integration.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ]
