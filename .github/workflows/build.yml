name: Development Lint & Build

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint application
        run: yarn lint

      - name: Build application
        run: yarn build
        env:
          # Fallback to dev API when the repo secret is unset (build only validates env shape).
          API_UPSTREAM_URL: ${{ secrets.API_UPSTREAM_URL != '' && secrets.API_UPSTREAM_URL || 'https://dev-iron-blue-ldpia6skza-lm.a.run.app' }}
          NEXT_PUBLIC_NODE_ENV: ${{ secrets.NEXT_PUBLIC_NODE_ENV != '' && secrets.NEXT_PUBLIC_NODE_ENV || 'development' }}
